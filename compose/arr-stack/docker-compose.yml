services:
  # qBittorrent - Cliente BitTorrent com Web UI integrada
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Campo_Grande
      - WEBUI_PORT=8085
      - TORRENTING_PORT=6881
    volumes:
      - ./data/qbittorrent/config:/config
      - /home/umbrel/umbrel/external/disk1/media/torrents:/downloads
    ports:
      - "8085:8085"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped

  # Prowlarr - Gerenciador centralizado de indexadores moderno (Torznab/Newznab)
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Campo_Grande
    volumes:
      - ./data/prowlarr/config:/config
    ports:
      - "9696:9696"
    restart: unless-stopped

  # Jackett - Proxy / Tradutor de indexadores de torrents
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Campo_Grande
      - AUTO_UPDATE=true
    volumes:
      - ./data/jackett/config:/config
      - /home/umbrel/umbrel/external/disk1/media/torrents:/downloads
    ports:
      - "9117:9117"
    restart: unless-stopped

  # Radarr - Automação de catálogo e download de Filmes
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Campo_Grande
    volumes:
      - ./data/radarr/config:/config
      - /home/umbrel/umbrel/external/disk1/media/movies:/movies
      - /home/umbrel/umbrel/external/disk1/media/torrents:/downloads
    ports:
      - "7878:7878"
    restart: unless-stopped

  # Sonarr - Automação de catálogo e download de Séries de TV e Animes
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Campo_Grande
    volumes:
      - ./data/sonarr/config:/config
      - /home/umbrel/umbrel/external/disk1/media/series:/tv
      - /home/umbrel/umbrel/external/disk1/media/torrents:/downloads
    ports:
      - "8989:8989"
    restart: unless-stopped

  # Bazarr - Gerenciamento e download automático de Legendas
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Campo_Grande
    volumes:
      - ./data/bazarr/config:/config
      - /home/umbrel/umbrel/external/disk1/media/movies:/movies
      - /home/umbrel/umbrel/external/disk1/media/series:/tv
    ports:
      - "6767:6767"
    restart: unless-stopped

  # Jellyseerr (Seerr) - Portal moderno de pedidos de mídias integrado ao Jellyfin, Radarr e Sonarr
  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=debug
      - TZ=America/Campo_Grande
      - PUID=1000
      - PGID=1000
    ports:
      - "5055:5055"
    volumes:
      - ./data/jellyseerr/config:/app/config
    restart: unless-stopped

  # FlareSolverr - Bypass de Cloudflare Protection para Prowlarr e Jackett
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=America/Campo_Grande
    ports:
      - "8191:8191"
    restart: unless-stopped

networks:
  default:
    name: homelab_network
    external: true
